# Render Blueprint: 15-minute cron job for the sheet social posters.
# Connect the repo to Render once (New -> Blueprint); it provisions from this file.
services:
  - type: cron
    name: fanedit-sheet-posters
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    schedule: "*/15 * * * *"
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_SHEET_CHANNEL
        value: fan-edit-central-database
      - key: DISCORD_ERROR_CHANNEL
        value: bot-logs
      - key: BUFFER_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        value: "1240699955783812"
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: PYTHONUNBUFFERED
        value: "1"
