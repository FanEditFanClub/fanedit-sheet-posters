name: list-buffer-channels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: list buffer channels
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get("BUFFER_TOKEN", "").strip()
          if not token:
              print("NO_BUFFER_TOKEN")
              raise SystemExit(0)
          print("TOKEN_PRESENT length", len(token))
          def gql(query, variables=None):
              body = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(
                  "https://api.buffer.com", data=body, method="POST",
                  headers={"Authorization": "Bearer " + token,
                           "Content-Type": "application/json",
                           "User-Agent": "poster-pipeline/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  print("HTTP", e.code, raw[:300].replace(token, "[redacted]"))
                  return {}
          data = gql("query { account { organizations { id name } } }")
          if data.get("errors"):
              msg = json.dumps(data["errors"])[:300]
              print("ACCOUNT_ERRORS", msg.replace(token, "[redacted]"))
          orgs = ((data.get("data") or {}).get("account") or {}).get("organizations") or []
          print("ORG_COUNT", len(orgs))
          for org in orgs:
              print("ORG", org.get("id"), org.get("name"))
              ch = gql(
                  "query($orgId: OrganizationId!) { channels(input: {organizationId: $orgId}) { id name service isDisconnected isLocked } }",
                  {"orgId": org["id"]})
              if ch.get("errors"):
                  print("CHANNEL_ERRORS", json.dumps(ch["errors"])[:300].replace(token, "[redacted]"))
              channels = (ch.get("data") or {}).get("channels") or []
              print("CHANNEL_COUNT", len(channels))
              for c in channels:
                  print("CHANNEL service={service} id={id} name={name} disconnected={isDisconnected} locked={isLocked}".format(**c))
          PY
