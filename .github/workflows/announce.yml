name: one-shot-announce
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message to post to the discord-moderators channel"
        required: true
        type: string
permissions:
  contents: read
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: post to discord-moderators
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request, urllib.error

          def api(path, token, data=None, method="GET"):
              req = urllib.request.Request(
                  "https://discord.com/api" + path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": f"Bot {token}",
                           "Content-Type": "application/json",
                           "User-Agent": "DiscordBot (fanedit-announce, 1.0)"},
                  method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode("utf-8", errors="replace")
                      return json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raise SystemExit(
                      f"discord {method} {path} HTTP {e.code}: "
                      f"{e.read()[:200]}")

          def key(n):
              return re.sub(r"^[^a-z0-9]+", "", n.lstrip("#").lower())

          token = os.environ["DISCORD_BOT_TOKEN"]
          want = key("discord-moderators")
          cid = None
          for g in api("/users/@me/guilds", token) or []:
              for c in api(f"/guilds/{g['id']}/channels", token) or []:
                  if key(c.get("name", "")) == want and c.get("type") == 0:
                      cid = c["id"]
                      break
              if cid:
                  break
          if not cid:
              raise SystemExit("channel #discord-moderators not found")
          api(f"/channels/{cid}/messages", token,
              {"content": os.environ["MESSAGE"][:2000]}, "POST")
          print("posted to channel", cid)
          PYEOF
