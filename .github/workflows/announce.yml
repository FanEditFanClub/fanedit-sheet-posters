name: one-shot-announce
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to post to #discord-moderators'
        required: true
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post message via bot token
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          token = os.environ['BOT_TOKEN']
          message = os.environ['MESSAGE']
          guild_id = '1529915531736383702'
          want = ''.join(c for c in '🌐discord-moderators' if ord(c) < 128)
          auth = {'Authorization': 'Bot ' + token}
          req = urllib.request.Request(
              'https://discord.com/api/v10/guilds/%s/channels' % guild_id,
              headers=auth)
          channels = json.load(urllib.request.urlopen(req))
          ch = next(c for c in channels if c.get('name') == want)
          body = json.dumps({'content': message}).encode()
          req = urllib.request.Request(
              'https://discord.com/api/v10/channels/%s/messages' % ch['id'],
              data=body,
              headers=dict(auth, **{'Content-Type': 'application/json'}))
          resp = json.load(urllib.request.urlopen(req))
          print('posted message id:', resp['id'], 'channel:', ch['name'])
          PYEOF
