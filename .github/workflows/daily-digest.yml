name: daily-digest
on:
  # 22:00 UTC = 6pm EDT in summer, 5pm EST in winter (GitHub cron is UTC-only
  # and cannot follow US daylight saving).
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: run digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFIER_PAT: ${{ secrets.NOTIFIER_PAT }}
          DISCORD_DIGEST_CHANNEL: cyberchat
          DISCORD_ERROR_CHANNEL: discord-moderators
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python digest.py
