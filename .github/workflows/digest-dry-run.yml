name: digest-dry-run
# Temporary: exercise digest.py with repo secrets without posting.
# Removed before merge. Push to the feature branch only.
on:
  push:
    branches: [cursor/digest-source-bullets-65e9]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dry run digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFIER_PAT: ${{ secrets.NOTIFIER_PAT }}
          DISCORD_DIGEST_CHANNEL: 📐cyber-chat💬
          DRY_RUN: "1"
          DISCORD_ERROR_CHANNEL: discord-moderators
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python digest.py
