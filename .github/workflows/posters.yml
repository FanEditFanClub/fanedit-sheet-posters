name: social-posters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posters
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: redo facebook and x posts
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python redo_posts.py
