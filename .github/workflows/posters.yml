name: social-posters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posters
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: test error alert
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ERROR_CHANNEL: discord-moderators
        run: |
          python - <<'PYEOF'
          import os
          from destinations import resolve_discord_channel_id, post_discord
          token = os.environ["DISCORD_BOT_TOKEN"]
          want = os.environ["DISCORD_ERROR_CHANNEL"]
          cid = resolve_discord_channel_id(token, want)
          ok = post_discord(token, cid, "Test alert from the Fan Edit posters pipeline — error alerts are wired to this channel. Nothing is wrong; please ignore.")
          print("ALERT_TEST_POSTED" if ok else "ALERT_TEST_FAILED")
          PYEOF
