name: social-posters
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: posters
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: validate fb token
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python validate_fb.py; true
      - name: fb redo
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python fb_redo.py; true
      - name: delete old x post
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python x_cleanup.py; true
