name: discord-updates
on:
  schedule:
    # 14:00 UTC = 10am EDT / 9am EST daily: mods see Discord's updates in the morning
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discord-updates
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: run discord updates watcher
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MOD_CHANNEL: discord-moderators
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python discord_updates.py
