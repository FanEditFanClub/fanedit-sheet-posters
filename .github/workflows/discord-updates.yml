name: discord-updates
on:
  schedule:
    # 14:00 UTC = 10am EDT / 9am EST daily: mods see Discord's updates in the morning
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: updates (default), cleanup-226, or update-avatar'
        required: false
        default: 'updates'
permissions:
  contents: write
concurrency:
  group: discord-updates
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: cleanup 226 migrated-shortcut posts
        if: github.event.inputs.mode == 'cleanup-226'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python cleanup_226.py
      - name: update webhook avatar
        if: github.event.inputs.mode == 'update-avatar'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python update_webhook_avatar.py
      - name: run discord updates watcher
        if: github.event.inputs.mode != 'cleanup-226'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MOD_CHANNEL: discord-moderators
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python discord_updates.py
